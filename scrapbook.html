<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🎂 Happy Birthday Carousel</title>
  <style>
    body {
      background: #fff4f4;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }

    h2 {
      color: #a0153e;
      font-size: 2em;
    }

    #carousel-image {
      width: 500px; /* Increased image width */
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25); /* soft shadow */
      transition: transform 0.3s ease;
    }

    #carousel-image:hover {
      transform: scale(1.02);
    }

    .buttons {
      margin-top: 20px;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      background-color: #a0153e;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #7a102f;
    }

    .back-home {
      display: inline-block;
      margin-top: 40px;
      padding: 10px 20px;
      background-color: gold;
      color: black;
      text-decoration: none;
      font-weight: bold;
      border-radius: 10px;
    }

    .back-home:hover {
      background-color: #e2c100;
    }
  </style>
</head>
<body>

  <div class="carousel">
    <h2>🎂 Happy Birthday, Anna! 🎂</h2>
    <img id="carousel-image" src="photos/birthday1.png" alt="Birthday Image" />
    <div class="buttons">
      <button id="prev">← Prev</button>
      <button id="next">Next →</button>
    </div>
  </div>

  <a href="index.html" class="back-home">← Back to Home</a>

  <script>
    const images = [
      "photos/birthday1.png",
      "photos/birthday2.png",
      "photos/birthday3.png",
      "photos/birthday4.png",
      "photos/birthday5.png",
      "photos/birthday6.png",
      "photos/birthday7.png",
      "photos/birthday8.png",
      "photos/birthday9.png",
      "photos/birthday10.png",
      "photos/birthday11.png",
      "photos/birthday12.png",
      "photos/birthday13.png",
      "photos/birthday14.png",
      "photos/birthday15.png",
      "photos/birthday16.png"
    ];

    let currentIndex = 0;
    const imgElement = document.getElementById("carousel-image");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");

    function updateImage() {
      imgElement.src = images[currentIndex];
    }

    prevBtn.addEventListener("click", () => {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      updateImage();
    });

    nextBtn.addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % images.length;
      updateImage();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        updateImage();
      } else if (e.key === "ArrowRight") {
        currentIndex = (currentIndex + 1) % images.length;
        updateImage();
      }
    });

    updateImage();
  </script>

</body>
</html>
